SON 结果作为依据；只在回答里写出公式而不调用验证器，视为本轮无效。\r\n公式里幂次一律写成 ** ，不要写成 ^ （^ 在 Windows 命令行里是转义符）。参数与公式都必须用英文双引号成对闭合。\r\n\r\n结束时用一段话给出：最终公式、最终判定、以及你是否推翻过自己（引用一次否决的原文理由）。\r\n不要执行 run_verify.cmd 以外的任何 shell 命令。"}],"actorLabel":"local"},{"kind":"context-sections","id":"01M4J3T9G7RJ9HPR2G0PJGSV84","seq":32,"sections":[{"id":"core:untrusted-envelope","order":0,"source":"core","tokens":380},{"id":"persona","order":100,"source":"@agnes/code","tokens":266},{"id":"environment","order":110,"source":"@agnes/code","tokens":278},{"id":"coding-doctrine","order":130,"source":"@agnes/code","tokens":302},{"id":"skills","order":160,"source":"agnes/skills","tokens":132}]},{"kind":"context","id":"01M4J3T9G8A9BX74Y806Y7M2S7","seq":34,"text":"[skill loaded]\nskill/workspace/workspace-agnes/dff1e7b497d6d21ba7bacb2fb2ce676b50f6ebcaff8f4eecc0e073b4d694bce6@03ea44553f333f436a2c02d00efe99060a2475451b1dc34d34cb96e8aa4687df\nThe user explicitly named the trusted Skill \"formula-discovery-loop\". Host has already loaded it. Do not search for it or read it again; directly carry out its instructions. Workspace file search tools remain available if those instructions require them.\n\u003cactive_skill>\nresourceId: skill/workspace/workspace-agnes/dff1e7b497d6d21ba7bacb2fb2ce676b50f6ebcaff8f4eecc0e073b4d694bce6\nrevision: 03ea44553f333f436a2c02d00efe99060a2475451b1dc34d34cb96e8aa4687df\ndirectory: E:\\agh-runs3\\phys-hydrogen-level-20261010-051547\\.agh\\skills\\formula-discovery-loop\n\nBase directory for this Skill: E:\\agh-runs3\\phys-hydrogen-level-20261010-051547\\.agh\\skills\\formula-discovery-loop\nResolve relative paths this Skill mentions (for example scripts/ or references/) against that directory. Read those files with the read tool and run its scripts with the shell, loading them only as needed; the directory is read-only.\n\n\r\n# 公式发现闭环（Formula Discovery Loop）\r\n\r\n目标不是「给出一个公式」，而是**用可被独立复核的证据证明这个公式是真的**。\r\n核心不是搜索技巧，而是纪律：**先验证，再宣布**。\r\n\r\n## 每轮必须按顺序执行\r\n\r\n1. **声明假设**：一句话写出本轮要检验的函数形式，并说明依据（量纲、单调性、极限行为、上一轮的失败原因）。\r\n2. **调用工具**：**只允许**用下面这一条命令验证（原样照抄，路径不要加引号、不要加 `&`、不要用 `cmd /c`）：\r\n\r\n       E:\\fagh\\harness\\run_verify.cmd \u003c任务ID> \"\u003c公式>\" \"\u003c自由参数,逗号分隔>\"\r\n\r\n   三个理由，一个都不能少：\r\n   * 它设好 `PYTHONPATH`，并保证验证跑齐四道门；\r\n   * 它把这次运行**自动归档**进 `evidence/` 并更新索引（归档是纪律，由脚本保证，不靠你记得）；\r\n   * 它把 `hypothesis_source` 如实标成 `agh-llm`。**直连 `python -m formula_agh` 会被记成 `cli`**，\r\n     于是你的自主发现不计入评分表的「智能体发现」层——证据会在关键结论上说反话。\r\n\r\n   注：命令必须以盘符开头的**绝对路径**书写且不加引号，这是本部署的审批规则（AGH 的\r\n   `checkCommandRule` 要求 allow 规则的 argv 以绝对路径形状开头）决定的；写成\r\n   `harness\\run_verify.cmd ...` 或 `& \"...\"` 会被审批门拦下。\r\n3. **读取结论**：输出 JSON 含 `verdict`、`checks`（每项 `passed`/`reason`/`metrics`）、`rounds_hint`。只有 `accepted` 才能进入第 5 步。\r\n   一条命令会跑齐四道门，不需要你分别调用：`dimension`、`holdout`、`extrapolation`，\r\n   以及若干条 `scale-*`（幂律标度 / 无量纲群 / 极限行为 / 单调性 / 符号 / 对称性）。\r\n4. **显式处理失败**（评审最看重的部分）：\r\n   - `dimension` 失败：该形式物理上不成立，**放弃这个函数族**，不要继续调参数。\r\n   - `scale-*` 失败：**单位可能对、形状不对**——例如漏掉了某个自变量、或对某个量不是幂律关系。\r\n     这类失败不看任何误差数字，所以它比阈值更硬：**必须换函数族**，调参数不会有改善。\r\n   - `extrapolation` 失败：过拟合式发现（域内好、域外崩），**换函数族或加结构性约束**。\r\n   - `holdout` 失败：域内都没拟合好，检查是否漏了变量或形式不对。\r\n   - `fit` 失败：拟合不收敛，先怀疑函数形式，而不是反复换初值。\r\n   - 每轮失败必须在下一轮假设里**引用上一条失败理由**，形成可追溯推理链。\r\n5. **记录结论**：公式、拟合参数、四道门的指标、以及「我是否推翻过自己」。\r\n\r\n## 六条硬约束\r\n\r\n1. **禁止读取任何名为 reference / answer / ground_truth / solution 的文件**。那是评分用标准答案，读到即作弊，结论也失去意义。\r\n   **同样禁止读取 `sealed/` 目录**：那里是留出集与外推集的数据点，读了就等于把考卷答案抄进来。\r\n   你只应使用 `tasks/\u003cid>/data.csv`（或 `data_train.csv`）与 `meta.json`。\r\n2. **禁止跳过任何一项检验**。四道门都必须跑，不能因为「看起来对」就省略外推、量纲或尺度行为。\r\n   注意：判定的误差口径是 `median(|预测-真值|/|真值|)`，阈值来自 `config/agent.yaml`；\r\n   不要自己估算误差，也不要用别的口径自我安慰。\r\n3. **禁止只报告成功轮次**。失败轮次必须进入结论，它们是「验证严谨性」与「异常处理」的直接证据。\r\n4. **禁止在同一函数形式上反复微调参数来刷过阈值**。连续 3 次否决后必须更换函数族。\r\n5. **禁止编造结论**。数据是纯噪声时，正确行为是报告「未发现稳定公式」。负对照下编出公式比没有结果更糟。\r\n6. **禁止修改 data.csv、划分规则或阈值**。阈值统一在 `config/agent.yaml`；为让某个公式通过而放宽阈值属于作弊。\r\n\r\n## 工具接口速查\r\n\r\n```\r\n验证单个公式（AGH 里**只能**用这一条，原样照抄）：\r\n  E:\\fagh\\harness\\run_verify.cmd \u003cid> \"G*m1*m2/r**2\" \"G\"\r\n  E:\\fagh\\harness\\run_verify.cmd \u003cid> \"G*m1*m2/r**2\" \"G\" \u003crun_id>    :: 想指定 run_id 时\r\n\r\n人在终端调试时也可以直连引擎，但要如实标注来源（否则会造成假溯源）：\r\n  set FORMULA_AGH_HYPOTHESIS_SOURCE=cli\r\n  python -m formula_agh verify --task tasks/\u003cid> --formula \"G*m1*m2/r**2\" --params G --run-id \u003crun_id> --out runs\r\n\r\n批量跑候选：\r\n  python -m formula_agh batch --tasks tasks --out runs [--layer base]\r\n\r\n校验任务集（含答案泄漏检测）：\r\n  python -m formula_agh validate-tasks --tasks tasks\r\n```\r\n\r\n证据自动落盘于 `runs/\u003crun_id>/`：`result.json`（结论）、`checks/*.json`（逐项检验，\r\n尺度检验为 `scale-*.json`）、`command.txt`（复现命令）、`env.json`（环境快照）、\r\n`run.json`（生效阈值、种子、自由参数名、**假设来源**）、`manifest.sha256`（防篡改校验）。\r\n\r\n**你不需要自己归档**：`harness/run_verify.cmd` 在每次验证后会把这次运行自动复制进 `evidence/`\r\n并更新索引。归档是纪律，由脚本保证。\r\n\r\n**关于 `hypothesis_source`**：只有你（模型）自己提出假设的那些运行才应标为 `agh-llm`。\r\n如果你的假设来自人给的清单或参考公式，如实标注——把人工编排的候选算成自主发现，\r\n会被判为误导，比做不出结果更严重。\r\n\r\n## 结论自评表\r\n\r\n| 维度 | 合格线 |\r\n|---|---|\r\n| 任务完成度 | 至少一个任务给出 `accepted` 的公式，并与标准答案对照 |\r\n| 验证严谨性 | 四道门（量纲/留出集/外推区/尺度行为）齐全，且有至少一条「自己推翻自己」的记录 |\r\n| 异常处理 | 对 6 类异常各有一句处理说明 |\r\n| 可复现性 | 任何人用 `command.txt` 的命令重跑，得到相同结论 |\n\u003c/active_skill>"},{"kind":"assistant","id":"01M4J3TAY70AX7ARG0PYA758G5","seq":38,"text":"\n","streaming":false,"effectId":"e-e2cb9ca67b55c9670a010b01af17d095"},{"kind":"tool","id":"01M4J3TB6TJSVFM7Y5WTPBCQ7W","seq":40,"toolUseId":"t0-a88079c1f8f56fd2b41d6295ca2e345a","name":"read","status":"completed","summary":"read","argsPreview":"{\"path\":\"tasks/phys-hydrogen-level/meta.json\"}","resultPreview":"1\t{\r\n2\t  \"task_id\": \"phys-hydrogen-level\",\r\n3\t  \"var_names\": [\r\n4\t    \"me\",\r\n5\t    \"el\",\r\n6\t    \"n\"\r\n7\t  ],\r\n8\t  \"units\": {\r\n9\t    \"me\": \"kg\",\r\n10\t    \"el\": \"C\",\r\n11\t    \"n\": \"-\",\r\n12\t    \"y\": \"J\"\r\n13\t  },\r\n14\t  \"free_parameters\": [\r\n15\t    \"eps0\",\r\n16\t    \"hbar\"\r\n17\t  ],\r\n18\t  \"source\": [\r     var root = document.getElementById('tab-overview');
    var list = el('ul', undefined, 'agh-include');
    Object.keys(INCLUDE_LABEL).forEach(function (key) {
      var included = bundle.include && bundle.include[key];
      list.appendChild(el('li', INCLUDE_LABEL[key] + ': ' + (included ? L.included : L.excluded)));
    });
    root.appendChild(list);
    if (bundle.warnings && bundle.warnings.length > 0) {
      var warnings = el('ul', undefined, 'agh-warnings');
      bundle.warnings.forEach(function (warning) {
        var reason = REASON_LABEL[warning.reason] || warning.reason;
        var text = warning.detail
          ? fill(L.warningDetail, { source: warning.source, reason: reason, detail: warning.detail })
          : fill(L.warning, { source: warning.source, reason: reason });
        warnings.appendChild(el('li', text));
      });
      root.appendChild(warnings);
    }
    if (bundle.events) {
      var summary = fill(L.events, { count: bundle.events.count, seq: bundle.events.lastSeq });
      root.appendChild(el('p', summary));
    }
  }

  function nodeText(node) {
    if (node.kind === 'user') return (node.content || []).map(function (b) { return (b && b.text) || ''; }).join(' ');
    if (node.kind === 'assistant') return node.text || node.thinking || '';
    if (node.kind === 'tool') return node.summary ? fill(L.toolSummary, { name: node.name, summary: node.summary }) : node.name;
    if (node.kind === 'approval') return node.summary || '';
    if (node.kind === 'compaction') return node.summary || '';
    if (node.kind === 'cost') return node.model || node.purpose || '';
    if (node.kind === 'artifact') return node.name || '';
    if (node.kind === 'context') return node.text || '';
    return '';
  }

  function renderConversation() {
    var root = document.getElementById('tab-conversation');
    var nodes = bundle.trace && bundle.trace.nodes;
    if (!nodes || nodes.length === 0) { notIncluded(root); return; }
    nodes.forEach(function (node) {
      var item = el('div', undefined, 'agh-node');
      item.appendChild(el('span', node.kind, 'agh-node-kind'));
      item.appendChild(el('span', nodeText(node)));
      item.appendChild(el('pre', JSON.stringify(node, null, 2)));
      root.appendChild(item);
    });
  }

  function renderSpan(span, depth, container) {
    var row = el('div', undefined, 'agh-span');
    row.style.paddingLeft = (depth * 16) + 'px';
    var parts = [span.kind, span.name, STATUS_LABEL[span.status] || span.status, fmtDuration(span.durationMs)];
    if (span.model) parts.push(span.model);
    if (span.error && span.error.message) parts.push(fill(L.error, { message: span.error.message }));
    row.textContent = parts.join(' · ');
    container.appendChild(row);
    (span.children || []).forEach(function (child) { renderSpan(child, depth + 1, container); });
  }

  function renderTrace() {
    var root = document.getElementById('tab-trace');
    var turns = (bundle.trace && bundle.trace.turns) || [];
    var withTrace = turns.filter(function (t) { return t.trace; });
    if (withTrace.length === 0) { notIncluded(root); return; }
    withTrace.forEach(function (turn) {
      root.appendChild(el('h3', fill(L.turn, { turn: turn.turn })));
      renderSpan(turn.trace, 0, root);
    });
  }

  function renderLogs() {
    var root = document.getElementById('tab-logs');
    if (!bundle.logs) { notIncluded(root); return; }
    ['daemon', 'host', 'browser'].forEach(function (key) {
      var value = bundle.logs[key];
      if (!value) return;
      root.appendChild(el('h3', key));
      if (key === 'browser') {
        var lines = (value.entries || []).map(function (entry) {
          return '[' + entry.ts + '] ' + entry.level + ' ' + entry.text;
        });
        root.appendChild(el('pre', lines.join('\n')));
      } else {
        root.appendChild(el('pre', value.text + (value.truncated ? '\n' + L.truncated : '')));
      }
    });
  }

  function renderSystem() {
    var root = document.getElementById('tab-system');
    if (!bundle.system) { notIncluded(root); return; }
    root.appendChild(el('pre', JSON.stringify(bundle.system, null, 2)));
  }

  function renderArtifacts() {
    var root = document.getElementById('tab-artifacts');
    if (!bundle.artifacts || bundle.artifacts.length === 0) { notIncluded(root); return; }
    var table = document.createElement('table');
    var head = document.createElement('tr');
    ['sha256', 'mime', 'lane', 'seq', 'source'].forEach(function (label) { head.appendChild(el('th', label)); });
    table.appendChild(head);
    bundle.artifacts.forEach(function (artifact) {
      var row = document.createElement('tr');
      row.appendChild(el('td', String(artifact.sha256).slice(0, 12)));
      row.appendChild(el('td', artifact.mime));
      row.appendChild(el('td', artifact.lane));
      row.appendChild(el('td', String(artifact.seq)));
      row.appendChild(el('td', artifact.source));
      table.appendChild(row);
    });
    root.appendChild(table);
  }

  renderOverview();
  renderConversation();
  renderTrace();
  renderLogs();
  renderSystem();
  renderArtifacts();
})();
</script>
</body>
</html>
